# kgrowth: 攻撃の大きさまで数えるための詳細ログ（2026-10-25）。http ブロックの中で読まれる conf.d に置く。
# 今の access.log（combined）はそのまま。こちらはリクエストの大きさ・Content-Type・どのホスト/ポートに来たかを足す。
# PHP2Shell は「大きな POST を任意の .php へ」送るので、rl=（リクエスト全体のバイト数）で見分けられる。
# logrotate は /var/log/nginx/*.log をまとめて回すので、追加の設定は要らない。
log_format kgrowth_detail '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" rl=$request_length ct="$content_type" '
                          'host=$host port=$server_port rt=$request_time';
access_log /var/log/nginx/access_detail.log kgrowth_detail;
